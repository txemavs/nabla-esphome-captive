<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabla WiFi Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0f1c;color:#e0e6f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.logo{width:80px;height:70px;margin-bottom:16px}
.logo svg{width:100%;height:100%}
h1{font-size:1.5rem;font-weight:600;margin-bottom:8px;color:#fff}
.mac{font-size:.75rem;color:#6b7a99;margin-bottom:24px}
.card{background:#151c2c;border-radius:12px;padding:20px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.net{padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.net:hover{background:#1d2640}
.net.sel{background:#1a3a6e;border:1px solid #1a5cff}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.bar{width:3px;background:#3b5998;border-radius:1px}
.bar.a{height:4px}.bar.b{height:8px}.bar.c{height:12px}.bar.d{height:16px}
.bars.s1 .bar.b,.bars.s1 .bar.c,.bars.s1 .bar.d{background:#2a3a5c}
.bars.s2 .bar.c,.bars.s2 .bar.d{background:#2a3a5c}
.bars.s3 .bar.d{background:#2a3a5c}
.lock{width:14px;height:14px;fill:#6b7a99}
.ssid{flex:1;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{margin-top:16px}
label{display:block;font-size:.75rem;color:#8899b3;margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid #2a3a5c;border-radius:8px;background:#0d1320;color:#e0e6f0;font-size:.9rem;margin-bottom:12px}
input:focus{outline:none;border-color:#1a5cff}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#1a5cff;color:#fff;font-size:.95rem;font-weight:500;cursor:pointer;transition:background .15s}
button:hover{background:#1449cc}
button:disabled{background:#2a3a5c;cursor:not-allowed}
.msg{text-align:center;padding:16px;font-size:.9rem}
.msg.ok{color:#4ade80}
.msg.err{color:#f87171}
.scan{font-size:.8rem;color:#6b7a99;text-align:center;margin-top:12px}
@media(max-width:400px){.card{padding:16px}h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="logo">
<svg viewBox="0 0 80 70" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M40 65L5 10H75L40 65Z" stroke="#1a5cff" stroke-width="4" fill="none"/>
<path d="M40 50L20 18H60L40 50Z" stroke="#1a5cff" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
</div>
<h1 id="name">WiFi Setup</h1>
<div class="mac" id="mac"></div>
<div class="card">
<div id="nets"></div>
<form class="form" id="form" onsubmit="return save(event)">
<label for="s">Network Name (SSID)</label>
<input type="text" id="s" name="ssid" required autocomplete="off">
<label for="p">Password</label>
<input type="password" id="p" name="psk" autocomplete="off">
<button type="submit" id="btn">Connect</button>
</form>
<div id="msg"></div>
<div class="scan" id="scan">Scanning networks...</div>
</div>
<script>
var sel='',nets=[];
function bars(r){var c='bars';if(r>-50)c+=' s4';else if(r>-65)c+=' s3';else if(r>-80)c+=' s2';else c+=' s1';return'<div class="'+c+'"><div class="bar a"></div><div class="bar b"></div><div class="bar c"></div><div class="bar d"></div></div>'}
function lockIcon(){return'<svg class="lock" viewBox="0 0 24 24"><path fill="currentColor" d="M12 17a2 2 0 002-2 2 2 0 00-2-2 2 2 0 00-2 2 2 2 0 002 2m6-9a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V10a2 2 0 012-2h1V6a5 5 0 0110 0v2h1m-6-5a3 3 0 00-3 3v2h6V6a3 3 0 00-3-3z"/></svg>'}
function render(){var h='';for(var i=0;i<nets.length;i++){var n=nets[i],c='net';if(n.ssid===sel)c+=' sel';h+='<div class="'+c+'" onclick="pick(\''+n.ssid.replace(/'/g,"\\'")+'\')">'+bars(n.rssi)+(n.lock?lockIcon():'')+'<span class="ssid">'+n.ssid+'</span></div>'}document.getElementById('nets').innerHTML=h}
function pick(s){sel=s;document.getElementById('s').value=s;render()}
function load(){fetch('/config.json').then(function(r){return r.json()}).then(function(d){document.getElementById('name').textContent=d.name||'WiFi Setup';document.getElementById('mac').textContent=d.mac||'';nets=d.aps.filter(function(a){return a.ssid});nets.sort(function(a,b){return b.rssi-a.rssi});document.getElementById('scan').style.display='none';render()}).catch(function(){document.getElementById('scan').textContent='Could not load networks'})}
function save(e){e.preventDefault();var s=document.getElementById('s').value,p=document.getElementById('p').value;if(!s)return false;document.getElementById('btn').disabled=true;document.getElementById('btn').textContent='Saving...';fetch('/wifisave?ssid='+encodeURIComponent(s)+'&psk='+encodeURIComponent(p)).then(function(r){if(r.ok){document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent='Saved! Device will connect to '+s+'.'}else throw new Error()}).catch(function(){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent='Failed to save. Try again.'}).finally(function(){document.getElementById('btn').disabled=false;document.getElementById('btn').textContent='Connect'});return false}
load();
</script>
</body>
</html>
